# Local overlay for loading the tools straight from this checkout, with no install
# step and no pnpm. The row uses a path relative to this file.
#
#   dsh --profile web --patch "$PWD/dsh-plugin/cordis.local.yml"
#
# A --patch overlay is an argv input, so it applies at launch: restart the harness
# for it to take effect. For hot-reloadable wiring, put the bundle row in
# ~/.dsh/profiles/web/cordis.patch.yml instead (that profile sets
# patchReload: live).
- insert:
    - id: laya-dsh-rag
      name: './index.js'
      config:
        baseUrl: http://127.0.0.1:8077
        timeoutMs: 120000
