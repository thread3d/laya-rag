[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-rag"
version = "0.1.0"
description = "Retrieval-augmented generation engine powered by the Laya decision engine, with a DeepSeek Harness (dsh) interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "laya>=0.3.20",
    "numpy<2",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
laya-rag = "laya_rag.cli:main"
laya-rag-serve = "laya_rag.api:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["laya_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_weights: requires downloaded Laya checkpoints and a working torch install",
]
